name: Collect YouTube Niche Radar data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::warning::YOUTUBE_API_KEY secret is not set - skipping collection"
            exit 0
          fi
          python niche-radar/collector/collect.py --out niche-radar/data/channels.json
      - name: Measure competition on YouTube
        # Runs after collection so new channels get probed on the same day. The collector's
        # own search budget is already spent by then, so this gets its own allowance; at
        # 100 units per probe it covers ~18 channels and picks the least recently checked,
        # which sweeps the catalogue over a couple of weeks.
        if: ${{ !cancelled() }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::warning::YOUTUBE_API_KEY secret is not set - skipping competition probe"
            exit 0
          fi
          python niche-radar/collector/competition.py --data niche-radar/data/channels.json --budget 2000
      - name: Describe new channels with Gemini
        if: ${{ !cancelled() }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE }}
        run: python niche-radar/collector/enrich.py --data niche-radar/data/channels.json --limit 400
      - name: Commit changed data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "niche-radar-bot"
          git config user.email "niche-radar-bot@users.noreply.github.com"
          git add niche-radar/data/channels.json niche-radar/data/lang_checks.json
          git add niche-radar/data/history
          git diff --cached --quiet && exit 0
          git commit -m "Update niche-radar channel data"
          git pull --rebase
          git push
