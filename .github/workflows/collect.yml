name: Collect YouTube Niche Radar data

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python niche-radar/collector/collect.py --out niche-radar/data/channels.json
      - name: Commit changed data
        run: |
          git config user.name "niche-radar-bot"
          git config user.email "niche-radar-bot@users.noreply.github.com"
          git add niche-radar/data/channels.json
          git diff --cached --quiet && exit 0
          git commit -m "Update niche-radar channel data"
          git push
